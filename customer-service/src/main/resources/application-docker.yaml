spring:
  datasource:
    url: jdbc:postgresql://customer-postgres:5432/customer_db
    username: sa
    password: sa
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: redis
    port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.kika.customerservice: DEBUG